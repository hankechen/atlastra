<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlastra — Ask Atlastra</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=96">
<style>
  /* Scoped to this page -- kept out of the shared styles.css to avoid a
     site-wide cache-bust (see the css/js versioning note in aws-deployment). */
  .ask-wrap{display:flex;flex-direction:column;height:calc(100vh - 140px);max-width:760px}
  .ask-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 12px}
  .ask-empty{color:var(--muted);padding:24px 4px}
  .ask-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .ask-chip{background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;
    font-size:13px;cursor:pointer;color:var(--text)}
  .ask-chip:hover{border-color:var(--accent)}
  .ask-msg{max-width:82%;padding:11px 15px;border-radius:14px;line-height:1.5;font-size:14.5px}
  .ask-msg.q{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .ask-msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--border2);
    border-bottom-left-radius:4px;white-space:pre-wrap}
  .ask-msg.a.pending{color:var(--muted)}
  .ask-form{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--border2)}
  .ask-form textarea{flex:1;resize:none;min-height:46px;max-height:120px;background:var(--card2);
    border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:11px 14px;font:inherit}
  .ask-form textarea:focus{outline:none;border-color:var(--accent)}
  .ask-form button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 20px;
    font-weight:600;cursor:pointer}
  .ask-form button:disabled{opacity:.5;cursor:default}
  .ask-note{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="search"><span>⌕</span><input id="searchBox" placeholder="Search players, teams, matches…"><span class="kbd">/</span></div>
      <div class="tb-icons"><span>🔔</span><span>🌙</span><div class="avatar"></div></div>
    </div>

    <div class="page-head">
      <div><h2>Ask Atlastra</h2><p>Ask a question about any top-5-league player, team, or stat leader — answered from the site's live data, not a guess.</p></div>
    </div>

    <div class="card ask-wrap">
      <div class="ask-log" id="askLog">
        <div class="ask-empty" id="askEmpty">
          Try asking:
          <div class="ask-chips" id="askChips"></div>
        </div>
      </div>
      <form class="ask-form" id="askForm">
        <textarea id="askInput" placeholder="Ask a question…" maxlength="300" rows="1"></textarea>
        <button type="submit" id="askSend">Ask</button>
      </form>
      <div class="ask-note">Answers are generated by AI from Atlastra's data and can occasionally be wrong — always check the underlying page for anything that matters.</div>
    </div>
  </main>
</div>
<script src="/js/api.js?v=32"></script>
<script src="/js/ask.js?v=1"></script>
</body>
</html>
